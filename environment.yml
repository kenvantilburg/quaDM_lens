# Conda environment for quaDM_lens.
#
#   conda env create -f environment.yml
#   conda activate quaDM
#
# Versions below are the ones the paper figures were produced with; the code has
# no exotic requirements and should work with any reasonably recent release.
#
# NOT included: `classy` (the CLASS Python wrapper), needed only by Pnl.ipynb to
# regenerate Delta2_output.csv / Delta2_extended_output.csv. Those CSVs are
# committed, so every other notebook runs without CLASS. Install it separately
# with `pip install classy` if you want to rebuild them.
#
# The figures use LaTeX text rendering (rcParams text.usetex = True), so a TeX
# distribution with `latex` and `dvipng` on the PATH is required. The animation
# cells of micro_lens.ipynb additionally need `ffmpeg`.
name: quaDM
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy>=1.26
  - scipy>=1.11
  - matplotlib>=3.8
  - seaborn>=0.13
  - pandas>=2.0
  - astropy>=6.0
  - tqdm
  - jupyterlab
  - ipykernel
  - ffmpeg
  - pip
  - pip:
      - lenstronomy>=1.11
